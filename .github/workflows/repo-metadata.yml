name: Repository metadata
on:
  push:
    paths:
      - ".github/workflows/repo-metadata.yml"
permissions: write-all
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Set description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/BryanFiFife/EchoQuorum \
            -d '{"description":"Independence-aware quorum verification for AI agent swarms. Count provenance groups, not just agent IDs."}'
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/BryanFiFife/EchoQuorum/topics \
            -d '{"names":["ai-agents","agentic-ai","multi-agent-systems","ai-safety","provenance","consensus","security","python","zero-dependencies"]}'
