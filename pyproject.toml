[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoquorum"
version = "0.1.0"
description = "Independence-aware quorum checks for AI agent swarms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BryanFiFife"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []

[project.scripts]
echoquorum = "echoquorum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
